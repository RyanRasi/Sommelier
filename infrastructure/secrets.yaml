# ─────────────────────────────────────────────────────────
# Secrets
#
# DO NOT commit real values to git.
# Fill in the values and apply with:
#   kubectl apply -f k8s/secrets.yaml
#
# Or create via CLI (safer — never touches a file):
#   kubectl create secret generic sommelier-secrets \
#     --namespace sommelier \
#     --from-literal=storage-account-name=YOUR_STORAGE_ACCOUNT
# ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: sommelier-secrets
  namespace: sommelier
type: Opaque
stringData:
  storage-account-name: REPLACE_WITH_STORAGE_ACCOUNT_NAME
