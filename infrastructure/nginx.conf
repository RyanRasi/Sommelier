server {
    listen 80;
    server_name _;

    # Serve the React SPA
    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy ─────────────────────────────────────────
    # Requests to /api/ are forwarded to the api Kubernetes service.
    # The /api prefix is stripped before forwarding.
    # e.g. /api/recommend → http://api-service:8000/recommend
    location /api/ {
        proxy_pass         http://api-service:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow enough time for the LLM to respond (it can be slow)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── SPA fallback ──────────────────────────────────────
    # All other routes return index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Caching for static assets ─────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Security headers ──────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection      "1; mode=block" always;

    # Gzip compression
    gzip            on;
    gzip_vary       on;
    gzip_types      text/plain text/css application/json
                    application/javascript text/xml application/xml
                    application/xml+rss text/javascript;
}
